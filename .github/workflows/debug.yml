name: Build Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      outputs_dir: "${{ github.workspace }}/app/build/outputs"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Init Signature
        run: |
          touch local.properties
          echo ALIAS_NAME='ttskey' >> local.properties
          echo ALIAS_PASSWORD='ttskey123' >> local.properties
          echo KEY_PASSWORD='ttskey123' >> local.properties
          echo KEY_PATH='./key.jks' >> local.properties
          keytool -genkeypair -keystore $GITHUB_WORKSPACE/app/key.jks -alias ttskey -keyalg RSA -keysize 2048 -validity 10000 -storepass ttskey123 -keypass ttskey123 -dname "CN=TTS"

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew assembleAppDebug --build-cache --parallel --daemon --warning-mode all

      - name: Upload APK To Artifact
        uses: actions/upload-artifact@v4
        with:
          name: "TTS-Server_debug"
          path: ${{env.outputs_dir}}/apk/app/debug/*debug.apk
